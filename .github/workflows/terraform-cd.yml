name: Terraform CD

on:
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    environment: dev

    defaults:
      run:
        working-directory: iac

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Plan
        run: terraform plan -var-file=configuration/dev/main.tfvars

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=configuration/dev/main.tfvars

  deploy-stage:
    runs-on: ubuntu-latest
    needs: deploy-dev

    environment: stage

    defaults:
      run:
        working-directory: iac

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Plan
        run: terraform plan -var-file=configuration/stage/main.tfvars

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=configuration/stage/main.tfvars